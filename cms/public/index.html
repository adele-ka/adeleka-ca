<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ka-cms</title>
<style>
:root{--bg:#F1F5F2;--ink:#1B2E24;--muted:#4A6155;--card:#fff;--line:#CBD8D0;--sage:#8EA69B;--deep:#1F3329;--warn:#F6E8C9;--bad:#F5C6C6;--good:#DCE8B4;--r:14px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#101A15;--ink:#E8F0EA;--muted:#A3B9AD;--card:#17241D;--line:#2B3F34;--warn:#352C10;--bad:#4A1B1B;--good:#26381F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:-.01em}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px}
button:hover{background:color-mix(in srgb,var(--sage) 26%,transparent)}
button.primary{background:var(--sage);border-color:var(--sage);color:#14241B;font-weight:600}
button.danger{border-color:#B72A1E;color:#B72A1E}
button:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;max-width:1200px;margin:0 auto;padding:20px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;max-height:70vh;overflow:auto}
.list button{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:8px 10px;margin:0}
.list button[aria-current="true"]{background:color-mix(in srgb,var(--sage) 35%,transparent);font-weight:600}
.list small{display:block;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.field{margin:0 0 16px}
.field label{display:block;font-weight:600;margin-bottom:4px}
.field .hint{color:var(--muted);font-size:14px}
.gal{display:grid;gap:8px;margin-bottom:8px}
.gal-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gal-row input{flex:1;min-width:160px}
.gal-row button{padding:6px 10px}
.gal-tag{color:var(--muted);min-width:70px}
.field input.auto{background:transparent;border-style:dashed;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{min-height:90px;resize:vertical}
textarea.md{min-height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14.5px}
.check{display:flex;gap:10px;align-items:center}
.check input{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tools button{padding:4px 10px;font-size:14px}
.thumb{width:64px;height:64px;object-fit:contain;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.preview{border:1.5px dashed var(--line);border-radius:10px;padding:14px 18px;background:var(--bg)}
.preview h2,.preview h3{margin:.8em 0 .3em}
.note{border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.note.ok{background:var(--good)}.note.bad{background:var(--bad)}.note.warn{background:var(--warn)}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;max-height:240px;overflow:auto}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(10,18,14,.6)}
h1,h2{margin:0 0 12px;letter-spacing:-.02em}
.sep{height:1px;background:var(--line);margin:18px 0}
</style>
</head>
<body>
<header>
  <b>ka-cms <span style="font-weight:400;color:var(--muted)">· edit, preview, publish</span></b>
  <div class="row">
    <button id="btnBuild">build preview</button>
    <button id="btnPublish" class="primary">publish to GitHub</button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="tabs" id="tabs" role="group" aria-label="content types"></div>
    <div class="list" id="list"></div>
    <p style="margin:10px 0 0"><button id="btnNew" class="primary" style="width:100%">+ new</button></p>
  </aside>
  <main>
    <div class="panel" id="editor"><p style="color:var(--muted)">choose something on the left, or click “new”.</p></div>
  </main>
</div>

<dialog id="pubDlg">
  <h2>publish to GitHub</h2>
  <div id="gitInfo"></div>
  <div class="field"><label for="msg">describe what changed (a short note to your future self)</label><input type="text" id="msg" value="update content"></div>
  <div class="row"><button id="doPublish" class="primary">publish now</button><button id="closePub">close</button></div>
  <div id="pubOut"></div>
</dialog>

<script>
(function(){
  var H={'X-KA-CMS':'1','Content-Type':'application/json'};
  function api(url,opts){return fetch(url,Object.assign({headers:H},opts||{})).then(function(r){return r.json().catch(function(){return {error:'bad reply'}})})}
  function $(s,r){return (r||document).querySelector(s)}
  function el(tag,props,kids){var e=document.createElement(tag);Object.keys(props||{}).forEach(function(k){if(k==='text')e.textContent=props[k];else if(k==='class')e.className=props[k];else e.setAttribute(k,props[k])});(kids||[]).forEach(function(c){e.appendChild(c)});return e}
  var state={schema:null,type:null,items:[],cur:null,dirty:false};
  var fieldEls={};var autoFields=[];
  // same rule as lib/readtime.js: about 220 words a minute, rounded up
  function readtime(md){var t=String(md||'').replace(/```[\s\S]*?```/g,' ').replace(/!\[[^\]]*\]\([^)]*\)/g,' ').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[#>*_`~|-]/g,' ');var n=t.split(/\s+/).filter(function(w){return /[a-z0-9]/i.test(w)}).length;return Math.max(1,Math.ceil(n/220))+' min read'}

  function slugify(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function say(msg,kind){var n=$('#status');if(!n){return}n.className='note '+(kind||'ok');n.textContent=msg}

  function renderTabs(){
    var t=$('#tabs');t.innerHTML='';
    Object.keys(state.schema.types).forEach(function(k){
      var b=el('button',{type:'button','aria-pressed':String(k===state.type),text:state.schema.types[k].label});
      b.addEventListener('click',function(){if(confirmLeave())selectType(k)});
      t.appendChild(b);
    });
  }
  function confirmLeave(){return !state.dirty||confirm('you have unsaved changes. leave anyway?')}

  function selectType(k){
    state.type=k;state.cur=null;state.dirty=false;renderTabs();
    var T=state.schema.types[k];
    $('#btnNew').style.display=T.kind==='json'?'none':'block';
    api('/api/list?type='+k).then(function(items){
      state.items=items;renderList();
      if(T.kind==='json')openItem(null);
      else $('#editor').innerHTML='<p style="color:var(--muted)">choose something on the left, or click “new”.</p>';
    });
  }
  function renderList(){
    var l=$('#list');l.innerHTML='';
    if(state.schema.types[state.type].kind==='json'){l.appendChild(el('p',{text:'one file with your site-wide text.',style:'padding:8px 10px;color:var(--muted);margin:0'}));return}
    if(!state.items.length)l.appendChild(el('p',{text:'nothing here yet.',style:'padding:8px 10px;color:var(--muted);margin:0'}));
    state.items.forEach(function(it){
      var b=el('button',{type:'button','aria-current':String(state.cur&&state.cur.slug===it.slug)});
      b.appendChild(document.createTextNode(it.title));
      b.appendChild(el('small',{text:[it.date,it.draft?'draft':''].filter(Boolean).join(' · ')}));
      b.addEventListener('click',function(){if(confirmLeave())openItem(it.slug)});
      l.appendChild(b);
    });
  }

  function openItem(slug){
    var T=state.schema.types[state.type];
    if(T.kind==='json'){api('/api/item?type='+state.type).then(function(r){state.cur={slug:null,isNew:false};buildForm(r.data||{},'')});return}
    if(slug===null){
      // a new item starts from the type's template in schema.json (the same sections the site shows), then today's date
      var tpl=T.template||{};var d={};
      T.fields.forEach(function(f){if(f.type==='date')d[f.name]=today();if(f.type==='select'&&f.options&&!f.optional)d[f.name]=f.options[0]});
      Object.keys(tpl.data||{}).forEach(function(k){d[k]=tpl.data[k]});
      state.cur={slug:'',isNew:true};buildForm(d,tpl.body||'');return;
    }
    api('/api/item?type='+state.type+'&slug='+encodeURIComponent(slug)).then(function(r){
      if(r.error){say(r.error,'bad');return}
      state.cur={slug:slug,isNew:false};buildForm(r.data,r.body);renderList();
    });
  }
  $('#btnNew').addEventListener('click',function(){if(confirmLeave())openItem(null)});

  function artSrc(f,v){return !v?'':'/static/img/'+v+(f.preview==='art'?'.webp':'')}

  function buildForm(data,body){
    var T=state.schema.types[state.type];
    var ed=$('#editor');ed.innerHTML='';fieldEls={};autoFields=[];state.dirty=false;
    var title=state.cur.isNew?'new '+T.label.replace(/s$/,''):(T.kind==='json'?T.label:(data[T.titleField]||state.cur.slug));
    ed.appendChild(el('h1',{text:title}));
    ed.appendChild(el('div',{id:'status',class:'note ok',text:'',style:'display:none'}));
    if(state.cur.isNew&&T.kind!=='json'){
      var sf=el('div',{class:'field'});sf.appendChild(el('label',{text:'address (made from the title, you can change it)',for:'f_slug'}));
      var si=el('input',{type:'text',id:'f_slug'});sf.appendChild(si);ed.appendChild(sf);fieldEls.__slug=si;
      si.addEventListener('input',function(){si.dataset.touched='1';state.dirty=true});
    }
    T.fields.forEach(function(f){
      var wrap=el('div',{class:'field'});var id='f_'+f.name;
      var val=f.name==='body'?body:data[f.name];
      var label=el('label',{text:f.label||f.name,for:id});
      var input;
      if(f.type==='bool'){
        wrap.className='field check';input=el('input',{type:'checkbox',id:id});input.checked=!!val;wrap.appendChild(input);wrap.appendChild(el('label',{text:f.label,for:id,style:'margin:0;font-weight:500'}));
      }else if(f.type==='select'){
        wrap.appendChild(label);var row=el('div',{class:'row'});
        input=el('select',{id:id});if(f.optional)input.appendChild(el('option',{value:'',text:'(none)'}));(f.options||[]).forEach(function(o){var op=el('option',{value:o,text:o});input.appendChild(op)});
        if(val&&(f.options||[]).indexOf(val)<0)input.appendChild(el('option',{value:val,text:val}));
        input.value=val||'';row.appendChild(input);
        if(f.preview){var th=el('img',{class:'thumb',alt:''});th.src=artSrc(f,input.value);input.addEventListener('change',function(){th.src=artSrc(f,input.value)});row.appendChild(th);input.parentNode;}
        row.firstChild.style.flex='1';wrap.appendChild(row);
      }else if(f.type==='textarea'){
        wrap.appendChild(label);input=el('textarea',{id:id,rows:String(f.rows||3)});input.value=val||'';wrap.appendChild(input);
      }else if(f.type==='lines'){
        wrap.appendChild(label);input=el('textarea',{id:id,rows:'5'});input.value=(val||[]).join('\n');wrap.appendChild(input);
      }else if(f.type==='markdown'){
        wrap.appendChild(label);
        var tools=el('div',{class:'tools'});
        [['bold','**','**'],['italic','*','*'],['heading','## ',''],['link','[','](https://)'],['list','1. ',''],['quote','> ','']].forEach(function(t){
          var b=el('button',{type:'button',text:t[0]});b.addEventListener('click',function(){wrapSel(input,t[1],t[2])});tools.appendChild(b);
        });
        var pv=el('button',{type:'button',text:'preview'});tools.appendChild(pv);
        wrap.appendChild(tools);
        input=el('textarea',{id:id,class:'md'});input.value=val||'';wrap.appendChild(input);
        var box=el('div',{class:'preview',style:'display:none'});wrap.appendChild(box);
        pv.addEventListener('click',function(){
          if(box.style.display==='none'){api('/api/preview',{method:'POST',body:JSON.stringify({md:input.value})}).then(function(r){box.innerHTML=r.html||'';box.style.display='block';input.style.display='none';pv.textContent='edit'})}
          else{box.style.display='none';input.style.display='block';pv.textContent='preview'}
        });
      }else if(f.type==='gallery'){
        // a list of photos: each with a thumbnail, a description, move up/down, and remove
        wrap.appendChild(label);
        var gal=el('div',{class:'gal',id:id});var items=(Array.isArray(val)?val:val?[val]:[]).map(function(x){return typeof x==='string'?{src:x,alt:''}:x});
        var drawGal=function(){
          gal.innerHTML='';
          if(!items.length)gal.appendChild(el('p',{class:'hint',text:'no photos. the illustration is used.',style:'margin:0 0 8px'}));
          items.forEach(function(it,i){
            var r=el('div',{class:'gal-row'});
            var t=el('img',{class:'thumb',alt:''});t.src=it.src?'/static'+it.src:'';r.appendChild(t);
            var a=el('input',{type:'text',placeholder:'describe the photo',value:it.alt||'','aria-label':'description for photo '+(i+1)});
            a.addEventListener('input',function(){it.alt=a.value;state.dirty=true});r.appendChild(a);
            var tag=el('small',{text:i===0?'card photo':'',class:'gal-tag'});r.appendChild(tag);
            var up=el('button',{type:'button',text:'↑','aria-label':'move up'});up.disabled=i===0;up.addEventListener('click',function(){items.splice(i-1,0,items.splice(i,1)[0]);state.dirty=true;drawGal()});r.appendChild(up);
            var dn=el('button',{type:'button',text:'↓','aria-label':'move down'});dn.disabled=i===items.length-1;dn.addEventListener('click',function(){items.splice(i+1,0,items.splice(i,1)[0]);state.dirty=true;drawGal()});r.appendChild(dn);
            var rm=el('button',{type:'button',text:'remove'});rm.addEventListener('click',function(){items.splice(i,1);state.dirty=true;drawGal()});r.appendChild(rm);
            gal.appendChild(r);
          });
        };
        drawGal();wrap.appendChild(gal);
        var gfile=el('input',{type:'file',accept:'image/*',multiple:'',style:'display:none'});
        var add=el('button',{type:'button',text:'add photos'});add.addEventListener('click',function(){gfile.click()});
        gfile.addEventListener('change',function(){
          var files=[].slice.call(gfile.files);gfile.value='';
          (function next(){var fl=files.shift();if(!fl){drawGal();return}
            var holder={value:''};uploadImage(fl,holder,{set src(v){}},function(){items.push({src:holder.value,alt:''});state.dirty=true;drawGal();next()});
          })();
        });
        wrap.appendChild(add);wrap.appendChild(gfile);
        input=gal;input.__items=function(){return items};
      }else if(f.type==='image'){
        wrap.appendChild(label);var row2=el('div',{class:'row'});
        input=el('input',{type:'text',id:id});input.value=val||'';input.style.flex='1';row2.appendChild(input);
        var th2=el('img',{class:'thumb',alt:''});th2.src=input.value?'/static'+input.value:'';row2.appendChild(th2);
        var file=el('input',{type:'file',accept:'image/*',style:'display:none'});
        var up=el('button',{type:'button',text:'upload photo'});up.addEventListener('click',function(){file.click()});
        file.addEventListener('change',function(){if(file.files[0])uploadImage(file.files[0],input,th2)});
        row2.appendChild(up);row2.appendChild(file);wrap.appendChild(row2);
        input.addEventListener('input',function(){th2.src=input.value?'/static'+input.value:''});
      }else{
        wrap.appendChild(label);input=el('input',{type:f.type==='date'?'date':f.type==='number'?'number':'text',id:id});input.value=val==null?'':val;wrap.appendChild(input);
      }
      if(f.auto==='readtime'){input.readOnly=true;input.classList.add('auto');autoFields.push(input)}
      if(f.hint)wrap.appendChild(el('div',{class:'hint',text:f.hint}));
      input.addEventListener('input',function(){state.dirty=true});input.addEventListener('change',function(){state.dirty=true});
      fieldEls[f.name]=input;ed.appendChild(wrap);
    });
    // keep reading time in step with the post as you type (the server works it out again on save)
    var bodyF=fieldEls.body;
    function updAuto(){autoFields.forEach(function(a){a.value=readtime(bodyF?bodyF.value:'')})}
    if(bodyF&&autoFields.length){bodyF.addEventListener('input',updAuto);updAuto()}
    var titleF=T.titleField&&fieldEls[T.titleField];
    if(titleF&&fieldEls.__slug)titleF.addEventListener('input',function(){if(!fieldEls.__slug.dataset.touched)fieldEls.__slug.value=slugify(titleF.value)});
    ed.appendChild(el('div',{class:'sep'}));
    var row3=el('div',{class:'row'});
    var save=el('button',{type:'button',class:'primary',text:'save'});save.addEventListener('click',saveItem);row3.appendChild(save);
    if(!state.cur.isNew&&T.kind!=='json'){var del=el('button',{type:'button',class:'danger',text:'delete'});del.addEventListener('click',deleteItem);row3.appendChild(del)}
    ed.appendChild(row3);
  }

  function wrapSel(ta,a,b){var s=ta.selectionStart,e=ta.selectionEnd,t=ta.value;ta.value=t.slice(0,s)+a+t.slice(s,e)+b+t.slice(e);ta.focus();ta.selectionStart=s+a.length;ta.selectionEnd=e+a.length;state.dirty=true}

  function collect(){
    var T=state.schema.types[state.type];var data={},body='';
    T.fields.forEach(function(f){
      var i=fieldEls[f.name];if(!i)return;var v;
      if(f.type==='bool')v=i.checked;
      else if(f.type==='gallery'){v=i.__items().filter(function(x){return x.src}).map(function(x){return x.alt?{src:x.src,alt:x.alt}:{src:x.src}});if(!v.length)v=''}
      else if(f.type==='lines')v=i.value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
      else v=i.value;
      if(f.name==='body')body=v;else data[f.name]=v;
    });
    return {data:data,body:body};
  }
  function saveItem(){
    var T=state.schema.types[state.type];var c=collect();
    var payload={type:state.type,data:c.data,body:c.body,isNew:state.cur.isNew,slug:state.cur.isNew?(fieldEls.__slug&&fieldEls.__slug.value||slugify(c.data[T.titleField])):state.cur.slug};
    var missing=T.fields.filter(function(f){return f.required&&!String(c.data[f.name]||'').trim()});
    if(missing.length){say('please fill in: '+missing.map(function(f){return f.label}).join(', '),'bad');$('#status').style.display='block';return}
    api('/api/item',{method:'POST',body:JSON.stringify(payload)}).then(function(r){
      var n=$('#status');n.style.display='block';
      if(r.error){say(r.error,'bad');return}
      state.dirty=false;say('saved. next: “build preview” to look at it, then “publish to GitHub” when you are happy.','ok');
      state.cur={slug:r.slug||state.cur.slug,isNew:false};
      api('/api/list?type='+state.type).then(function(items){state.items=items;renderList()});
    });
  }
  function deleteItem(){
    if(!confirm('delete this? (you can get it back from GitHub history, but not from here)'))return;
    api('/api/item?type='+state.type+'&slug='+encodeURIComponent(state.cur.slug),{method:'DELETE'}).then(function(r){
      if(r.error){say(r.error,'bad');return}
      state.dirty=false;selectType(state.type);
    });
  }

  // photo upload: shrinks big photos in the browser first (max 1600 px, WebP), then saves them
  function uploadImage(file,input,thumb,done){
    var n=$('#status');n.style.display='block';say('preparing photo...','warn');
    createImageBitmap(file).then(function(bm){
      var max=1600,sc=Math.min(1,max/Math.max(bm.width,bm.height));
      var c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      c.toBlob(function(blob){
        var useWebp=blob&&blob.type==='image/webp';
        var send=blob||file;
        var name=file.name.replace(/\.[^.]+$/,'')+(useWebp?'.webp':'.jpg');
        if(!useWebp){c.toBlob(function(b2){post(b2||file,name)},'image/jpeg',0.86)}else post(send,name);
      },'image/webp',0.86);
    }).catch(function(){post(file,file.name)});
    function post(blob,name){
      fetch('/api/upload?name='+encodeURIComponent(name),{method:'POST',headers:{'X-KA-CMS':'1'},body:blob}).then(function(r){return r.json()}).then(function(r){
        if(r.error){say(r.error,'bad');return}
        input.value=r.path;thumb.src='/static'+r.path;state.dirty=true;say('photo uploaded ('+Math.round(blob.size/1024)+' KB). remember to save.','ok');
        if(done)done();
      });
    }
  }

  // build preview
  $('#btnBuild').addEventListener('click',function(){
    var b=$('#btnBuild');b.disabled=true;b.textContent='building...';
    api('/api/build',{method:'POST',body:'{}'}).then(function(r){
      b.disabled=false;b.textContent='build preview';
      if(r.error){alert('the build failed: '+r.error);return}
      window.open('/preview/','kapreview');
    });
  });

  // publish
  var dlg=$('#pubDlg');
  function loadGit(){
    var g=$('#gitInfo');g.innerHTML='loading...';
    api('/api/git').then(function(r){
      g.innerHTML='';
      if(!r.repo){g.appendChild(el('div',{class:'note warn',text:r.message||'not a git repository'}));return}
      g.appendChild(el('div',{class:'note '+(r.remote?'ok':'warn'),text:(r.remote?'connected: '+r.remote.replace(/\s+\(.*\)/,''):'no GitHub address set up yet')+(r.branch?'  ·  branch: '+r.branch:'')}));
      g.appendChild(el('p',{text:r.changes.length?r.changes.length+' changed file'+(r.changes.length>1?'s':'')+' waiting to publish:':'nothing new to publish.',style:'margin:8px 0 4px'}));
      if(r.changes.length)g.appendChild(el('div',{class:'log',text:r.changes.join('\n')}));
    });
  }
  $('#btnPublish').addEventListener('click',function(){$('#pubOut').innerHTML='';dlg.showModal();loadGit()});
  $('#closePub').addEventListener('click',function(){dlg.close()});
  $('#doPublish').addEventListener('click',function(){
    var b=$('#doPublish');b.disabled=true;b.textContent='publishing...';
    api('/api/git/publish',{method:'POST',body:JSON.stringify({message:$('#msg').value})}).then(function(r){
      b.disabled=false;b.textContent='publish now';
      var o=$('#pubOut');o.innerHTML='';
      o.appendChild(el('div',{class:'note '+(r.ok?'ok':'bad'),text:r.ok?'published. GitHub will rebuild the site, and it should be live in about a minute.':'something did not work. read the steps below.'}));
      var txt=(r.log||[]).map(function(s){return (s.ok?'✓ ':'✗ ')+s.step+(s.out?'\n    '+s.out.replace(/\n/g,'\n    '):'')+(s.err?'\n    '+s.err.replace(/\n/g,'\n    '):'')}).join('\n');
      o.appendChild(el('div',{class:'log',text:txt}));
      if(!r.ok){
        var all=(r.log||[]).map(function(s){return s.err+s.out}).join(' ').toLowerCase();
        var hint='';
        if(/authentication|permission denied|could not read username|403/.test(all))hint='GitHub did not accept your sign-in. open GitHub Desktop (or run “gh auth login”) once to sign in, then try again.';
        else if(/conflict/.test(all))hint='the same file was changed on GitHub and here. open the folder in GitHub Desktop or VS Code to resolve it, or ask for help with this message.';
        else if(/no github address/.test(all))hint='connect this folder to your GitHub repository first (see the guide, “Put it on GitHub”).';
        if(hint)o.appendChild(el('div',{class:'note warn',text:hint}));
      }
      loadGit();
    });
  });

  window.addEventListener('beforeunload',function(e){if(state.dirty){e.preventDefault();e.returnValue=''}});
  api('/api/schema').then(function(s){state.schema=s;selectType(Object.keys(s.types)[0])});
})();
</script>
</body>
</html>
